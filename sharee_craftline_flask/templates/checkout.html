{% extends 'base.html' %}
{% block title %}Checkout — Sharee Craftline{% endblock %}
{% block content %}
<section class="checkout-layout"><div class="checkout-card glass-panel"><div class="section-head"><small>CHECKOUT</small><h1>অর্ডার নিশ্চিত করুন</h1></div><div id="checkoutItems" class="checkout-items"></div><form id="checkoutForm" class="order-form"><div class="form-grid"><label>নাম<input name="customer_name" required></label><label>ফোন<input name="phone" required></label><label>জেলা<input name="district" required></label><label>উপজেলা<input name="upazila" required></label></div><label>পূর্ণ ঠিকানা<textarea name="full_address" rows="4" required></textarea></label><label>ডেলিভারি চার্জ<select name="delivery_charge"><option value="80">ঢাকা — ৳80</option><option value="120">ঢাকার বাইরে — ৳120</option></select></label><button class="solid-btn wide" type="submit">অর্ডার কনফার্ম করুন</button></form><div id="orderResult" class="order-result"></div></div><aside class="summary-card glass-card"><small>ORDER SUMMARY</small><h3>মোট</h3><div class="summary-line"><span>পণ্য</span><strong id="summaryProduct">৳0</strong></div><div class="summary-line"><span>ডেলিভারি</span><strong id="summaryDelivery">৳0</strong></div><div class="summary-line total"><span>সর্বমোট</span><strong id="summaryTotal">৳0</strong></div></aside></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/checkout.js') }}"></script>{% endblock %}
