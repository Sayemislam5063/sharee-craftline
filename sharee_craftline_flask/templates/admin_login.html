<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-bg"><main class="auth-card glass-panel"><div class="brand-mark big">SC</div><small>SHAREE CRAFTLINE</small><h1>Admin Login</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button class="solid-btn wide" type="submit">Login</button></form></main></body></html>
